repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: eslint
        name: eslint --fix (frontend)
        entry: bash -c "cd frontend && pnpm exec eslint . --fix"
        language: system
        files: ^frontend/
        exclude: ^frontend/(node_modules|dist)/
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run --frozen mypy .
        language: system
        types: [python]
        pass_filenames: false

      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject.toml|uv.lock)$
        pass_filenames: false

      - id: pnpm-lock-check
        name: pnpm install --frozen-lockfile
        entry: bash -c "cd frontend && pnpm install --frozen-lockfile"
        language: system
        files: ^frontend/(package.json|pnpm-lock.yaml)$
        pass_filenames: false
