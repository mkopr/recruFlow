services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recruflow
      POSTGRES_PASSWORD: recruflow
      POSTGRES_DB: recruflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruflow -d recruflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # BUG28: a separate Postgres instance dedicated to `make test-integration`/`make ci`, so the
  # test suite's blanket table resets (e.g. reset_test_profiles) can never touch the real `db`
  # service's data. Ephemeral on purpose -- no named volume, so `docker compose down` (or a
  # container recreate) wipes it clean.
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recruflow
      POSTGRES_PASSWORD: recruflow
      POSTGRES_DB: recruflow_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruflow -d recruflow_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata: {}
  ollama_data: {}
